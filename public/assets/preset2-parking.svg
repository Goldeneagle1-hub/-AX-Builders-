<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shopWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background storefronts -->
  <rect width="600" height="220" fill="url(#shopWall)"/>
  
  <!-- Store 1 -->
  <rect x="30" y="50" width="160" height="170" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="60" width="140" height="25" fill="#0F3D5E" rx="3"/>
  <text x="110" y="77" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">제주 특산물 상회</text>
  <rect x="50" y="100" width="120" height="90" fill="#e0f2fe" stroke="#38bdf8"/>
  <rect x="80" y="190" width="60" height="30" fill="#334155"/>

  <!-- Store 2 & Alley Entrance -->
  <rect x="230" y="50" width="180" height="170" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="240" y="60" width="160" height="25" fill="#E86F1A" rx="3"/>
  <text x="320" y="77" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">동문 골목 베이커리</text>
  <rect x="250" y="100" width="140" height="90" fill="#fef3c7" stroke="#fbbf24"/>

  <!-- Sidewalk & Road -->
  <rect y="220" width="600" height="60" fill="#94a3b8"/>
  <!-- Sidewalk pavers lines -->
  <line x1="0" y1="250" x2="600" y2="250" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Asphalt Roadway -->
  <rect y="280" width="600" height="120" fill="#334155"/>

  <!-- Yellow curb line (No Parking curb) -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#facc15" stroke-width="6"/>
  <line x1="0" y1="286" x2="600" y2="286" stroke="#facc15" stroke-width="6"/>

  <!-- Illegally Parked Car on Yellow Line -->
  <!-- Car 1 (White Sedan parked right blocking shop entry) -->
  <rect x="70" y="270" width="170" height="70" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="110" y="250" width="100" height="35" rx="6" fill="#64748b" opacity="0.8"/>
  <circle cx="105" cy="340" r="16" fill="#1e293b"/>
  <circle cx="205" cy="340" r="16" fill="#1e293b"/>
  <rect x="195" y="295" width="40" height="16" fill="#ffffff" stroke="#000000"/>
  <text x="215" y="307" fill="#000000" font-size="9" font-family="monospace" text-anchor="middle" font-weight="bold">12가3456</text>

  <!-- Car 2 (Black SUV partially blocking alley) -->
  <rect x="340" y="275" width="190" height="75" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="380" y="252" width="110" height="38" rx="6" fill="#475569" opacity="0.9"/>
  <circle cx="375" cy="350" r="16" fill="#0f172a"/>
  <circle cx="485" cy="350" r="16" fill="#0f172a"/>

  <!-- Garbage Boxes & Bags illegally dumped at corner (flower bed) -->
  <rect x="15" y="215" width="45" height="35" fill="#78350f" rx="2" stroke="#451a03"/>
  <text x="37" y="235" fill="#fde68a" font-size="8" font-family="sans-serif" text-anchor="middle">박스폐기</text>
  <rect x="40" y="225" width="25" height="25" fill="#9a3412" rx="2"/>
  <circle cx="28" cy="245" r="8" fill="#475569" opacity="0.7"/>
  <circle cx="45" cy="246" r="9" fill="#15803d" opacity="0.7"/>

  <!-- Watermark / Demo disclaimer overlay banner -->
  <rect x="15" y="15" width="570" height="36" fill="#0f172a" rx="6" opacity="0.88"/>
  <text x="300" y="38" fill="#f59e0b" font-size="13" font-family="sans-serif" text-anchor="middle" font-weight="bold">
    [시연용 예시 이미지] 일도1동 상가 앞 황색실선 주차 및 적치물 — 실제 사건 증빙 자료 아님
  </text>
  
  <rect x="15" y="355" width="570" height="30" fill="#0f172a" rx="4" opacity="0.85"/>
  <text x="300" y="374" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">
    GPS: 33.5132, 126.5269 (제주시 일도1동 중앙로) | 인공지능 민원 시연 데이터
  </text>
</svg>
