<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Sky (overcast Jeju morning) -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  
  <!-- Distant mountain / Hallasan outline -->
  <path d="M 0 250 Q 200 180 350 210 T 600 240 L 600 400 L 0 400 Z" fill="#64748b" opacity="0.4"/>

  <!-- Farmland / Stone wall -->
  <rect y="260" width="600" height="140" fill="#334155"/>
  <rect y="310" width="600" height="90" fill="#1e293b"/>

  <!-- Guest house / lodging building -->
  <rect x="40" y="160" width="220" height="160" fill="url(#wallGrad)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="70" y="190" width="45" height="40" fill="#38bdf8" opacity="0.6" stroke="#475569" stroke-width="2"/>
  <rect x="140" y="190" width="45" height="40" fill="#38bdf8" opacity="0.6" stroke="#475569" stroke-width="2"/>
  <rect x="70" y="250" width="45" height="50" fill="#475569"/>
  <!-- Lodging signboard -->
  <rect x="60" y="170" width="100" height="16" fill="#0F3D5E" rx="2"/>
  <text x="110" y="182" fill="#ffffff" font-size="10" font-family="sans-serif" text-anchor="middle" font-weight="bold">JEJU STAY GUESTHOUSE</text>

  <!-- Distant farm ventilation pipe & shed -->
  <rect x="360" y="200" width="180" height="70" fill="#475569" stroke="#334155" stroke-width="2"/>
  <line x1="390" y1="200" x2="390" y2="160" stroke="#94a3b8" stroke-width="6"/>
  <line x1="480" y1="200" x2="480" y2="160" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="390" cy="155" r="8" fill="#64748b"/>
  <circle cx="480" cy="155" r="8" fill="#64748b"/>

  <!-- Road & Basalt stone wall -->
  <line x1="0" y1="330" x2="600" y2="330" stroke="#475569" stroke-width="4"/>
  <path d="M 0 325 Q 50 320 100 325 T 200 323 T 300 326 T 450 324 T 600 325" stroke="#0f172a" stroke-width="10" fill="none"/>

  <!-- Watermark / Demo disclaimer overlay banner -->
  <rect x="15" y="15" width="570" height="36" fill="#0f172a" rx="6" opacity="0.88"/>
  <text x="300" y="38" fill="#f59e0b" font-size="13" font-family="sans-serif" text-anchor="middle" font-weight="bold">
    [시연용 예시 이미지] 대정읍 숙박상권 원경 외벽 및 설비 — 실제 사건 증빙 자료 아님
  </text>
  
  <rect x="15" y="355" width="570" height="30" fill="#0f172a" rx="4" opacity="0.85"/>
  <text x="300" y="374" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">
    GPS: 33.2264, 126.2512 (서귀포시 대정읍 하모리) | 인공지능 민원 시연 데이터
  </text>
</svg>
