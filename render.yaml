services:
  - type: web
    name: jeju-minwon-mate
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: GEMINI_TEXT_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-transcribe
